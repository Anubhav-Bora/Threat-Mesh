add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.arcgis.com https://*.arcgisonline.com https://*.esri.com https://*.basemaps.cartocdn.com; font-src 'self' data: https://*.arcgis.com https://*.arcgisonline.com https://*.esri.com; connect-src 'self' blob: https://*.arcgis.com https://*.arcgisonline.com https://*.esri.com https://*.basemaps.cartocdn.com; worker-src 'self' blob:; manifest-src 'self'" always;
