[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "threatmesh-backend"
version = "0.1.0"
description = "ThreatMesh OSINT threat intelligence API and analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.10,<4",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<0.116",
  "google-genai>=1.0,<2",
  "httpx>=0.27,<1",
  "networkx>=3.3,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.10,<3",
  "pysigma>=0.11.20,<2",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]
