name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SCHEDULER_ENABLED: "false"
          LLM_PROVIDER: disabled
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production assets
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_ARCGIS_API_KEY: ""
        run: npm run build

  migrations:
    name: PostGIS migration smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: threatmesh
          POSTGRES_USER: threatmesh
          POSTGRES_PASSWORD: threatmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatmesh -d threatmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install .

      - name: Apply and inspect migrations
        env:
          DATABASE_URL: postgresql+asyncpg://threatmesh:threatmesh@localhost:5432/threatmesh
        run: |
          alembic upgrade head
          alembic current

  compose:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build
